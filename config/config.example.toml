# Configuration for garbage-collection-automation.
# Installed to /etc/garbage-collection-automation/config.toml on first install
# and never overwritten by later upgrades.

[address]
# Looked up at mijnafvalwijzer.nl; the addition is the letter or suffix, if any.
postcode = "1234AB"
house_number = "56"
addition = ""

[collection]
# The key the schedule API expects: a fixed one the public afvalwijzer clients
# all send, so not a per-user secret - but not ours to compile in either.
# GCA_AFVALWIJZER_API_KEY wins over this key when it is set, exactly as the
# Todoist token does; the README says where to read the value off.
api_key = ""
# How far ahead to look when building to-dos.
lookahead_days = 30
# The schedule publishes dates without a time, so this is the to-dos due moment
# (Europe/Amsterdam, on the collection day itself).
due_time = "07:00"
# Which waste streams to track. Valid codes: restafval, papier, gft, pmd, glas,
# textiel, kca, kerstbomen - not every municipality collects all of them.
types = ["restafval", "papier", "gft"]
# Be a polite guest on someone else's server.
timeout_seconds = 15
retries = 1

[export.todoist]
# The export is on unless this says otherwise - left commented out here because
# it needs a token, from either source below, and this file ships without one.
# Uncomment it once the token is in place; a true with no token fails the run,
# while the default on its own only skips the export and lets the rest carry on.
#enabled = true
# Prefer GCA_TODOIST_TOKEN over storing the token here. A cron run gets it from
# the env file next to this one - /etc/garbage-collection-automation/env - which
# run-job.sh sources before every run.
token = ""
# The project the to-dos go in; it has to exist in Todoist already. A name that
# is not there fails the run rather than being created, so a typo cannot scatter
# to-dos into a project nobody looks at.
project = "Home"
# The section within that project, by name; leave it empty to put the to-dos in
# the project itself. A section that is not there fails the run in the same way
# a project that is not there does.
section = ""
# How long before the collection moment the to-dos reminder goes off, in days.
# The to-dos themselves are created for the whole lookahead window above.
# Custom reminders need Todoist Pro; on a free account the run warns once and
# writes the to-dos without them.
remind_days_before = 1

[web]
# The local page: a small server that hands out the interface in ui/ and nothing
# else. Switch it on here, then restart it:
#   systemctl restart garbage-collection-automation-web
enabled = false
# It listens on the loopback interface only - the page has no login and shows the
# secrets, so only a loopback address is accepted here. Reach it from another
# machine over an ssh tunnel; the README has the command.
host = "127.0.0.1"
port = 8080

[logging]
level = "INFO"
